name: Java CI

on:
  push:
    paths:
      - 'implementations/java/**'
      - 'apps/admin-web/**'
      - 'shared/db/postgresql/**'
      - '.github/workflows/java-ci.yml'
      - 'build.sh'
  pull_request:
    paths:
      - 'implementations/java/**'
      - 'apps/admin-web/**'
      - 'shared/db/postgresql/**'
      - '.github/workflows/java-ci.yml'
      - 'build.sh'

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: PostgreSQL setup regressions
        run: python3 -m unittest discover -s shared/db/postgresql -p 'test_*.py'
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Build & install vopn (3.0-SNAPSHOT)
        run: |
          git clone --depth 1 https://github.com/FrodeRanders/java-vopn.git "$RUNNER_TEMP/java-vopn"
          mvn -q -DskipTests -f "$RUNNER_TEMP/java-vopn/pom.xml" install
      - name: Build & install modules (skip tests)
        working-directory: implementations/java
        run: mvn -q -DskipTests -pl graphql -am install
      - name: Unit tests (repo)
        working-directory: implementations/java
        run: mvn -q -pl repo test
      - name: Unit tests (graphql)
        working-directory: implementations/java
        run: mvn -q -pl graphql test

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: repo
          POSTGRES_PASSWORD: repo
          POSTGRES_DB: repo
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/admin-web/package-lock.json
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Build & install vopn (3.0-SNAPSHOT)
        run: |
          git clone --depth 1 https://github.com/FrodeRanders/java-vopn.git "$RUNNER_TEMP/java-vopn"
          mvn -q -DskipTests -f "$RUNNER_TEMP/java-vopn/pom.xml" install
      - name: Load PG schema & seed data
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          PGPASSWORD=repo psql -v ON_ERROR_STOP=1 -h localhost -U repo -d repo \
            -f shared/db/postgresql/schema.sql
          PGPASSWORD=repo psql -v ON_ERROR_STOP=1 -h localhost -U repo -d repo \
            -f shared/db/postgresql/procedures.sql
          PGPASSWORD=repo psql -v ON_ERROR_STOP=1 -h localhost -U repo -d repo \
            -f shared/db/postgresql/boot.sql
      - name: PostgreSQL migration regressions
        env:
          IPTO_PG_MIGRATION_TEST_CONTAINER: ${{ job.services.postgres.id }}
        run: python3 -m unittest discover -s shared/db/postgresql -p 'test_*.py'
      - name: Build UI, package application, and verify Java modules
        run: mvn -B -ntp -f implementations/java/pom.xml -pl it,quarkus-app -am -Pweb clean verify
      - name: Audit administration UI dependencies
        working-directory: apps/admin-web
        run: npm audit --audit-level=moderate
